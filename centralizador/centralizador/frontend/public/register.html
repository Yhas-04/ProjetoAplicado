<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RideHub - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .register-error {
            background: #FEE2E2;
            color: #DC2626;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .register-success {
            background: #D1FAE5;
            color: #16A34A;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }
        .password-strength {
            margin-top: 6px;
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .strength-bar {
            flex: 1;
            height: 3px;
            border-radius: 4px;
            background: #e5e7eb;
            transition: background 0.3s;
        }
        .strength-label {
            font-size: 11px;
            font-weight: 600;
            color: #6A6580;
            min-width: 48px;
            text-align: right;
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- CADASTRO DESKTOP -->
    <div class="login-page desktop-only">
        <div class="login-container">
            <div class="login-logo">
                <div class="brand-icon">⬡</div>
                <h1>RideHub</h1>
                <p>Crie sua conta e comece a economizar</p>
            </div>

            <h2 class="login-title">Criar conta</h2>
            <p class="login-subtitle">Preencha os dados abaixo para se cadastrar</p>

            <div id="msgErro" class="register-error"></div>
            <div id="msgSucesso" class="register-success"></div>

            <div class="login-field">
                <label>Nome completo</label>
                <input id="nome" type="text" placeholder="João Silva" autocomplete="name" />
            </div>

            <div class="login-field">
                <label>E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" />
            </div>

            <div class="login-field">
                <label>Senha</label>
                <input id="senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
                <div class="password-strength">
                    <div class="strength-bar" id="bar1"></div>
                    <div class="strength-bar" id="bar2"></div>
                    <div class="strength-bar" id="bar3"></div>
                    <span class="strength-label" id="strengthLabel"></span>
                </div>
            </div>

            <div class="login-field">
                <label>Confirmar senha</label>
                <input id="confirmarSenha" type="password" placeholder="Repita sua senha" autocomplete="new-password" />
            </div>

            <button class="login-btn" id="btnCadastrar" onclick="cadastrar()">Criar conta</button>

            <div class="login-divider">
                <span>OU</span>
            </div>

            <button class="login-google">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continuar com Google
            </button>

            <div class="login-register">
                Já tem conta? <a href="login.html">Fazer login</a>
            </div>
        </div>
    </div>

    <!-- CADASTRO MOBILE -->
    <div class="login-mobile mobile-only">
        <div class="login-container">
            <div class="login-logo">
                <div class="brand-icon">⬡</div>
                <h1>RideHub</h1>
                <p style="font-size:13px;color:#6A6580;margin-top:4px;">Crie sua conta</p>
            </div>

            <div id="msgErroMobile" class="register-error"></div>
            <div id="msgSucessoMobile" class="register-success"></div>

            <div class="login-field">
                <label>Nome completo</label>
                <input id="nomeMobile" type="text" placeholder="João Silva" autocomplete="name" />
            </div>

            <div class="login-field">
                <label>E-mail</label>
                <input id="emailMobile" type="email" placeholder="seu@email.com" autocomplete="email" />
            </div>

            <div class="login-field">
                <label>Senha</label>
                <input id="senhaMobile" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
            </div>

            <div class="login-field">
                <label>Confirmar senha</label>
                <input id="confirmarSenhaMobile" type="password" placeholder="Repita sua senha" autocomplete="new-password" />
            </div>

            <button class="login-btn" id="btnCadastrarMobile" onclick="cadastrarMobile()">Criar conta</button>

            <div class="login-divider">
                <span>OU</span>
            </div>

            <button class="login-google">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continuar com Google
            </button>

            <div class="login-register">
                Já tem conta? <a href="login.html">Fazer login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        const senhaInput = document.getElementById('senha');
        if (senhaInput) {
            senhaInput.addEventListener('input', () => atualizarForca(senhaInput.value));
        }

        function atualizarForca(senha) {
            const bars = [
                document.getElementById('bar1'),
                document.getElementById('bar2'),
                document.getElementById('bar3'),
            ];
            const label = document.getElementById('strengthLabel');
            if (!bars[0]) return;

            bars.forEach(b => b.style.background = '#e5e7eb');
            label.textContent = '';

            if (!senha) return;

            const temMin = senha.length >= 6;
            const temNum = /\d/.test(senha);
            const temEspecial = /[^a-zA-Z0-9]/.test(senha);

            let forca = 0;
            if (temMin) forca++;
            if (temNum) forca++;
            if (temEspecial) forca++;

            const cores = ['#DC2626', '#F59E0B', '#16A34A'];
            const labels = ['Fraca', 'Média', 'Forte'];

            for (let i = 0; i < forca; i++) {
                bars[i].style.background = cores[forca - 1];
            }
            label.textContent = labels[forca - 1];
            label.style.color = cores[forca - 1];
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading-spinner"></span>Criando conta...';
            } else {
                btn.disabled = false;
                btn.innerHTML = 'Criar conta';
            }
        }

        function mostrarErro(idErro, idSucesso, msg) {
            const el = document.getElementById(idErro);
            const ok = document.getElementById(idSucesso);
            el.textContent = msg;
            el.style.display = 'block';
            ok.style.display = 'none';
        }

        function mostrarSucesso(idErro, idSucesso, msg) {
            const el = document.getElementById(idSucesso);
            const err = document.getElementById(idErro);
            el.textContent = msg;
            el.style.display = 'block';
            err.style.display = 'none';
        }

        async function executarCadastro(nome, email, senha, confirmar, btn, idErro, idSucesso) {
            if (!nome || !email || !senha || !confirmar) {
                mostrarErro(idErro, idSucesso, 'Preencha todos os campos.');
                return;
            }
            if (senha.length < 6) {
                mostrarErro(idErro, idSucesso, 'A senha deve ter pelo menos 6 caracteres.');
                return;
            }
            if (senha !== confirmar) {
                mostrarErro(idErro, idSucesso, 'As senhas não coincidem.');
                return;
            }

            setLoading(btn, true);

            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nome, email, password: senha }),
                });

                if (res.status === 201) {
                    mostrarSucesso(idErro, idSucesso, 'Conta criada com sucesso! Redirecionando...');
                    setTimeout(() => window.location.href = 'login.html', 1800);
                } else if (res.status === 400) {
                    const data = await res.json().catch(() => ({}));
                    mostrarErro(idErro, idSucesso, data.message || 'E-mail já cadastrado.');
                } else {
                    mostrarErro(idErro, idSucesso, 'Erro ao criar conta. Tente novamente.');
                }
            } catch {
                mostrarErro(idErro, idSucesso, 'Não foi possível conectar ao servidor.');
            } finally {
                setLoading(btn, false);
            }
        }

        function cadastrar() {
            executarCadastro(
                document.getElementById('nome').value.trim(),
                document.getElementById('email').value.trim(),
                document.getElementById('senha').value,
                document.getElementById('confirmarSenha').value,
                document.getElementById('btnCadastrar'),
                'msgErro',
                'msgSucesso'
            );
        }

        function cadastrarMobile() {
            executarCadastro(
                document.getElementById('nomeMobile').value.trim(),
                document.getElementById('emailMobile').value.trim(),
                document.getElementById('senhaMobile').value,
                document.getElementById('confirmarSenhaMobile').value,
                document.getElementById('btnCadastrarMobile'),
                'msgErroMobile',
                'msgSucessoMobile'
            );
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const isMobile = window.innerWidth <= 768;
                if (isMobile) cadastrarMobile();
                else cadastrar();
            }
        });
    </script>
</body>
</html>
