<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RideHub - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

    <div class="login-page">
        <div class="login-container">
            <div class="login-logo">
                <div class="brand-icon">⬡</div>
                <h1>Criar conta</h1>
                <p>Preencha os dados abaixo para se cadastrar</p>
            </div>

            <div id="msgErro" class="login-error"></div>
            <div id="msgSucesso" class="register-success"></div>

            <div class="login-field">
                <label>Nome completo</label>
                <input id="nome" type="text" placeholder="João Silva" autocomplete="name" />
            </div>
            <div class="login-field">
                <label>E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" />
            </div>
            <div class="login-field">
                <label>Senha</label>
                <input id="senha" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="checkStrength(this.value)" />
                <div class="password-strength">
                    <div class="strength-bar" id="bar1"></div>
                    <div class="strength-bar" id="bar2"></div>
                    <div class="strength-bar" id="bar3"></div>
                    <span class="strength-label" id="strengthLabel"></span>
                </div>
            </div>
            <div class="login-field">
                <label>Confirmar senha</label>
                <input id="confirmarSenha" type="password" placeholder="Repita sua senha" autocomplete="new-password" />
            </div>

            <button class="login-btn" id="btnCadastrar" onclick="cadastrar()">Criar conta</button>

            <div class="login-divider"><span>ou</span></div>

            <button class="login-google">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continuar com Google
            </button>

            <div class="login-register">Já tem conta? <a href="login.html">Fazer login</a></div>
        </div>
    </div>

    <!-- Lógica original mantida -->
    <script>
        function checkStrength(password) {
            const bars = [
                document.getElementById('bar1'),
                document.getElementById('bar2'),
                document.getElementById('bar3')
            ];
            const label = document.getElementById('strengthLabel');
            let strength = 0;

            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/) || password.match(/[^a-zA-Z0-9]/)) strength++;

            const colors = ['#2b273c', '#f87171', '#fbbf24', '#6ee7b7'];
            const texts = ['', 'Fraca', 'Média', 'Forte'];

            bars.forEach((bar, i) => {
                if (i < strength) {
                    bar.style.background = colors[strength];
                } else {
                    bar.style.background = '#2b273c';
                }
            });
            label.innerText = strength > 0 ? texts[strength] : '';
        }

        function cadastrar() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmarSenha').value;
            const msgErro = document.getElementById('msgErro');
            const msgSucesso = document.getElementById('msgSucesso');

            msgErro.style.display = 'none';
            msgSucesso.style.display = 'none';

            if (!nome || !email || !senha || !confirmar) {
                msgErro.style.display = 'block';
                msgErro.innerText = 'Por favor, preencha todos os campos.';
                return;
            }

            if (senha.length < 6) {
                msgErro.style.display = 'block';
                msgErro.innerText = 'A senha deve ter no mínimo 6 caracteres.';
                return;
            }

            if (senha !== confirmar) {
                msgErro.style.display = 'block';
                msgErro.innerText = 'As senhas não coincidem.';
                return;
            }

            msgSucesso.style.display = 'block';
            msgSucesso.innerText = 'Cadastro realizado com sucesso! Redirecionando...';
            
            document.getElementById('btnCadastrar').disabled = true;
            
            setTimeout(() => {
                localStorage.setItem('auth_token', 'fake_token_123');
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
