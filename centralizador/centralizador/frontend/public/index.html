<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteiro - Mapa Interativo</title>
    <link rel="stylesheet" href="../public/css/style.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
</head>
<body>
    <header>
        <h1>Centralizador</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Sobre</a>
        </nav>
    </header>

    <div class="container">

        <div class="coluna-form">
            <form id="formRoteiro">
                <div class="form-container">
                    <div class="campo">
                        <label for="origem">Origem</label>
                        <input
                            type="text"
                            id="origem"
                            placeholder="Digite sua origem"
                            autocomplete="off">
                        <div id="sugestoesOrigem" class="sugestoes"></div>
                    </div>

                    <div class="campo">
                        <label for="destino">Destino</label>
                        <input
                            type="text"
                            id="destino"
                            placeholder="Digite seu destino"
                            autocomplete="off">
                        <div id="sugestoesDestino" class="sugestoes"></div>
                    </div>

                    <div id="loading" style="display:none;">Buscando endereços...</div>
                    <div id="erro" style="display:none;"></div>

                    <button type="button" id="btnBuscar">Comparar</button>
                </div>
            </form>
        </div>

        <div class="coluna-mapa">
            <section id="mapa">
                <div id="map"></div>
            </section>
        </div>

    </div>

      <footer>
        <p>© 2026 Centralizador</p>
        <nav>
            <a href="#">Início</a>
            <a href="#">Sobre</a>
        </nav>
    </footer>

    <section id="resultado"></section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/mapaLeaflet.js"></script>
</body>
</html>
